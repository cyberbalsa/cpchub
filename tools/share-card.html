<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CPC Hub share card</title>
<style>
@font-face { font-family: Pixel; src: url('../static/vendor/ms_sans_serif_bold.woff2'); font-weight: bold; }
* { box-sizing: border-box; } body { margin: 0; }
.card { width: 1200px; height: 630px; padding: 24px; background: #355844 url('../static/art/terrain.svg'); font-family: Tahoma, sans-serif; color: #384734; }
.frame { height: 100%; padding: 6px; background: #d2bd88; border: 2px solid #f9edc6; box-shadow: inset -3px -3px #827552, 5px 6px #1f382b; }
.title { height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; background: #33746a; color: #fff5da; font: bold 15px Pixel, sans-serif; }
.close { padding: 0 7px; font: bold 18px Tahoma, sans-serif; color: #354334; background: #d9c692; border: 2px outset #f5e4b8; }
.content { display: grid; grid-template-columns: 45% 55%; height: calc(100% - 36px); padding: 20px 14px 14px; gap: 0; }
.intro { padding: 38px 22px 20px; background: #f0e2b5 url('../static/art/paper.svg'); border: 1px solid #a29062; }
.name { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
.parking { font: bold 44px Pixel, sans-serif; color: #f4e6ba; background: #376f61; border: 3px double #e5d29e; width: 67px; height: 68px; text-align: center; line-height: 62px; }
.brand { font: bold 39px Pixel, sans-serif; letter-spacing: -1px; }
.game { margin: 0 0 24px; font-size: 14px; letter-spacing: 2px; font-weight: bold; color: #6a684e; }
h1 { margin: 0; font: bold 34px/1.45 Pixel, sans-serif; letter-spacing: -1px; }
.address { margin-top: 35px; font-size: 22px; font-weight: bold; color: #406d59; }
.note { margin: 12px 0 0; font-size: 15px; color: #6a684e; }
.picture { margin: 0 0 0 16px; padding: 5px; background: #aab184; border: 2px inset #cbd1a5; overflow: hidden; }
.picture img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: 55% 48%; }
</style></head><body>
<main class="card"><div class="frame">
  <div class="title"><span>CPC Hub · Community exchange</span><span class="close" aria-hidden="true">×</span></div>
  <div class="content"><section class="intro"><div class="name"><span class="parking">P</span><span class="brand">CPC HUB</span></div><p class="game">CAR PARK CAPITAL</p><h1>Blueprints<br>&amp; scenarios</h1><div class="address">cpchub.net</div><p class="note">Creations shared by fans.</p></section><figure class="picture"><img src="../static/art/community-hero.webp" alt="A city built in Car Park Capital"></figure></div>
</div></main>
</body></html>
