{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pages">{% if page_obj.has_previous %}<a class="win-button" href="{% querystring page=page_obj.previous_page_number %}">Previous</a>{% endif %}<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="win-button" href="{% querystring page=page_obj.next_page_number %}">Next</a>{% endif %}</nav>{% endif %}
