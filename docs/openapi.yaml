openapi: 3.1.0
info:
  title: CPC Hub API
  version: 1.0.0
  description: Versioned community catalog for Car Park Capital. OAuth authorization
    code + S256 PKCE for mod managers; scoped personal API keys for scripts.
paths:
  /api/v1/items/:
    get:
      operationId: v1_items_list
      parameters:
      - in: query
        name: mine
        schema:
          type: boolean
        description: Only your uploads
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search titles, descriptions and tags
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - newest
          - popular
          - updated
      - in: query
        name: type
        schema:
          type: string
        description: Content type slug
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - read
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedItemList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: v1_items_create
      description: Create metadata for a blueprint, blueprint pack or scenario. Mod
        uploads are disabled. API items start as drafts; upload a release and at least
        two screenshots, then PATCH status to published. Each item can have up to
        eight screenshots.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ItemRequest'
        required: true
      security:
      - PersonalAPIKey: []
      - oauth2:
        - write
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/items/{id}/:
    get:
      operationId: v1_items_retrieve
      description: Read a visible creation. Hidden creations return 403 with the public
        moderation reason. Shadow-banned and self-deleted creations return 404 to
        other users; their creator and staff browser sessions retain access. Drafts
        remain private to the creator and staff.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this item.
        required: true
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - read
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    patch:
      operationId: v1_items_partial_update
      description: Authors can edit their own metadata. Admin and Moderator browser
        sessions may edit any creation; API keys and OAuth tokens remain limited to
        their owner. Publishing requires an enabled file type, a release and at least
        two screenshots. Records a revision; files and previous releases are immutable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this item.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedItemRequest'
      security:
      - PersonalAPIKey: []
      - oauth2:
        - write
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    delete:
      operationId: v1_items_destroy
      description: Author-only soft deletion. Immediately private to the creator and
        staff; recoverable for 14 days with POST restore/. After 14 days the creation
        and stored files are permanently removed.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this item.
        required: true
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - write
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/items/{id}/history/:
    get:
      operationId: v1_items_history_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this item.
        required: true
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - read
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Revision'
          description: ''
  /api/v1/items/{id}/releases/:
    post:
      operationId: v1_items_releases_create
      description: Upload to an owned creation, or use an Admin or Moderator browser
        session to add a release to any creation. The file type must be enabled. Published
        items must have at least two screenshots before adding a release. Version
        strings are unique per item. Existing releases cannot be overwritten.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this item.
        required: true
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReleaseUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReleaseUploadRequest'
        required: true
      security:
      - PersonalAPIKey: []
      - oauth2:
        - write
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/items/{id}/releases/{release_id}/download/:
    get:
      operationId: v1_items_releases_download_retrieve
      description: Checks item visibility, then redirects to a short-lived signed
        Wasabi URL (302), or streams a local development file (200). Follow redirects
        without forwarding CPC Hub credentials to the storage host. A GET counts a
        download link issued, not a completed transfer; HEAD does not increment counts.
        Signed URLs default to 300 seconds. SHA-256 and size are in release metadata.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this item.
        required: true
      - in: path
        name: release_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - read
      - cookieAuth: []
      - {}
      responses:
        '200':
          headers:
            X-Content-SHA256:
              schema:
                type: string
              description: SHA-256 of the release file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
        '302':
          headers:
            Location:
              schema:
                type: string
              description: Expiring signed URL. Request this endpoint again for a
                fresh URL.
            X-Content-SHA256:
              schema:
                type: string
              description: SHA-256 of the release file.
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/items/{id}/restore/:
    post:
      operationId: v1_items_restore_create
      description: Restore your own self-deleted creation within 14 days. Existing
        draft status and moderation restrictions remain in effect.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this item.
        required: true
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - write
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/items/{id}/screenshots/:
    post:
      operationId: v1_items_screenshots_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this item.
        required: true
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScreenshotUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScreenshotUploadRequest'
        required: true
      security:
      - PersonalAPIKey: []
      - oauth2:
        - write
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Screenshot'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/items/{id}/screenshots/{screenshot_id}/:
    delete:
      operationId: v1_items_screenshots_destroy
      description: Remove an owned screenshot, or use an Admin browser session to
        remove any screenshot. Published creations must keep at least two screenshots;
        add a replacement or save as a draft first.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this item.
        required: true
      - in: path
        name: screenshot_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - write
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/items/{id}/screenshots/{screenshot_id}/image/:
    get:
      operationId: v1_items_screenshots_image_retrieve
      description: Checks item visibility before redirecting to a short-lived signed
        screenshot URL. Local development can return image bytes directly. Keep this
        application URL for future requests; signed URLs expire.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this item.
        required: true
      - in: path
        name: screenshot_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - read
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            image/webp:
              schema:
                type: string
                format: binary
          description: ''
        '302':
          headers:
            Location:
              schema:
                type: string
              description: Expiring signed WebP image URL.
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/keys/:
    get:
      operationId: v1_keys_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - oauth2:
        - keys:write
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedKeyList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    post:
      operationId: v1_keys_create
      description: Session or OAuth keys:write scope required. OAuth clients may mint
        only read/write scopes they hold, and manage only their own keys. API keys
        cannot mint more keys. The secret is returned once. Keys do not expire by
        default; omit days or send null. Set days to 1–90 for an expiring key. All
        keys can be revoked.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/KeyCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KeyCreateRequest'
        required: true
      security:
      - oauth2:
        - keys:write
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedKey'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/keys/{id}/:
    delete:
      operationId: v1_keys_destroy
      description: Revoke a key immediately. The audit record is retained.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this api key.
        required: true
      tags:
      - v1
      security:
      - oauth2:
        - keys:write
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/:
    get:
      operationId: v1_me_retrieve
      description: Minimal profile for the signed-in mod manager; no email or provider
        secrets.
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - read
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/types/:
    get:
      operationId: v1_types_list
      description: Discover enabled upload types and their accepted extensions.
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - read
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentType'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/types/{slug}/:
    get:
      operationId: v1_types_retrieve
      description: Discover enabled upload types and their accepted extensions.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - read
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentType'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    ContentType:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 200
        allowed_extensions:
          description: Lowercase extensions, e.g. [".zip", ".cpbp", ".json"]. ZIP
            contents are not executed or extracted.
        uploads_enabled:
          type: boolean
          description: Allow new creations and releases for this type.
      required:
      - name
      - slug
    Error:
      type: object
      properties:
        status:
          type: integer
        errors:
          description: Field errors or a detail message.
      required:
      - errors
      - status
    IssuedKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        prefix:
          type: string
          maxLength: 16
        scopes: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        key:
          type: string
          description: Shown only once. Store in the operating system credential store.
      required:
      - created_at
      - id
      - key
      - name
      - prefix
    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 100
        summary:
          type: string
          maxLength: 180
        description:
          type: string
          maxLength: 20000
        content_type:
          type: string
          description: 'An enabled type from /api/v1/types/: blueprints, blueprint-packs
            or scenarios. Mod uploads are currently disabled.'
        author:
          type: string
          readOnly: true
        tags:
          type: string
          description: Comma-separated tags
          maxLength: 200
        status:
          $ref: '#/components/schemas/StatusEnum'
        is_demo:
          type: boolean
          readOnly: true
        is_hidden:
          type: boolean
          readOnly: true
        hidden_reason:
          type: string
          readOnly: true
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        featured_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        downloads:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        releases:
          type: array
          items:
            $ref: '#/components/schemas/Release'
          readOnly: true
        screenshots:
          type: array
          items:
            $ref: '#/components/schemas/Screenshot'
          readOnly: true
      required:
      - author
      - content_type
      - created_at
      - deleted_at
      - description
      - downloads
      - featured_at
      - hidden_reason
      - id
      - is_demo
      - is_hidden
      - releases
      - screenshots
      - summary
      - title
      - updated_at
    ItemRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        summary:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
