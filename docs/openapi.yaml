        no expiry by default.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /o/authorize/
          tokenUrl: /o/token/
          scopes:
            read: Read your profile and catalog
            write: Publish and edit your uploads
            keys:write: Create and revoke API keys for this manager
