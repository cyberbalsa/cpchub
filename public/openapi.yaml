      - content_type
      - created_at
      - deleted_at
      - description
      - downloads
      - featured_at
      - hidden_reason
      - id
      - is_demo
      - is_hidden
      - publish_after_validation
      - releases
      - screenshots
      - summary
      - title
      - updated_at
    ItemRequest:
