        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/tags/:
    get:
      operationId: v1_tags_list
      description: Public tags with counts of visible, published creations. Tags need
        11 creations by default; Admins can change this threshold. Drafts, hidden,
        deleted, shadow-banned and demo creations do not count.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Find tag names containing this text.
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - read
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTagList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/tags/suggest/:
    get:
      operationId: v1_tags_suggest_list
      description: Existing tag suggestions for signed-in editors, including uncommon
        tags on public creations and tags on their own private creations. Other users'
        private tags are excluded. Returns up to 20 names; accepts the q substring
        filter.
      parameters:
      - in: query
        name: q
        schema:
          type: string
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - read
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagSuggestion'
          description: ''
  /api/v1/types/:
    get:
      operationId: v1_types_list
      description: Discover enabled upload types and their accepted extensions.
      tags:
      - v1
      security:
      - PersonalAPIKey: []
