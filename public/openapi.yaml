  /o/token/:
    post:
      operationId: oauth_token
      description: Exchange an S256 PKCE code or rotate a refresh token. Access tokens last one hour.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
      responses:
        "200":
          description: Issued tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthToken"
        "400": &a1
          description: OAuth error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /o/revoke_token/:
    post:
      operationId: oauth_revoke
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthRevokeRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthRevokeRequest"
      responses:
        "200":
          description: Token family revoked, or token already absent.
        "400": *a1
  /o/authorize/:
    get:
      operationId: oauth_authorize
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: client_id
          schema: &a2
            type: string
          required: true
        - in: query
          name: redirect_uri
          schema: &a3
            type: string
            format: uri
          required: true
        - in: query
          name: response_type
          schema: &a4
            type: string
            const: code
          required: true
        - in: query
          name: code_challenge_method
          schema: &a5
            type: string
            const: S256
          required: true
        - in: query
          name: code_challenge
          schema: &a6
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
          required: true
        - in: query
          name: scope
          schema: *a2
          required: false
        - in: query
          name: state
          schema: *a2
          required: false
      responses:
        "200":
          description: Consent page.
          content:
            text/html:
              schema: *a2
        "400": *a1
        "401": *a1
    post:
      operationId: oauth_consent
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthAuthorizeRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthAuthorizeRequest"
      responses:
        "302":
          description: Callback with code or access_denied and original state.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400": *a1
        "401": *a1
        "403": *a1
components:
  schemas:
    ContentType:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 200
        allowed_extensions:
          type: array
          items:
            type: string
            pattern: ^\.[a-z0-9]+$
          description: "Accepted native file extensions: .cpbp or .cpcs."
        uploads_enabled:
          type: boolean
          description: Allow new creations and releases for this type.
        max_upload_bytes:
          type: integer
          readOnly: true
          description: Current maximum size of each game file. Defaults to 15 MiB; Admin-adjustable.
      required:
        - slug
        - name
        - description
        - allowed_extensions
        - uploads_enabled
        - max_upload_bytes
    Error:
      type: object
      properties:
        status:
          type: integer
        errors:
          type: object
          properties:
            detail: *a2
          required:
            - detail
      required:
        - errors
        - status
    FileStats:
      type: object
      properties:
        schema_version:
          type: integer
          maximum: 1
          minimum: 1
        kind:
          $ref: "#/components/schemas/FileStatsKindEnum"
        format_version:
          type:
            - integer
            - "null"
          maximum: 3
          minimum: 2
        width:
          type: integer
          maximum: 2048
          minimum: 1
          description: Blueprint width, or largest map width, in tiles.
        depth:
          type: integer
          maximum: 2048
          minimum: 1
          description: Blueprint depth, or largest map depth, in tiles.
        height:
          type: integer
          maximum: 2048
          minimum: 1
          description: Blueprint height, or largest map height, in tiles.
        footprint_tiles:
          type: integer
          maximum: 67108864
          minimum: 1
          description: Width × depth for blueprints; sum of map areas for scenarios.
        objects:
          type:
            - integer
            - "null"
          maximum: 1000000
          minimum: 0
        object_types:
          type:
            - integer
            - "null"
          maximum: 1000000
          minimum: 0
        parking_spaces:
          type:
            - integer
            - "null"
          maximum: 1000000
          minimum: 0
          description: Saved ParkingBay objects; does not check road access or usability.
        golf_cart_spaces:
          type:
            - integer
            - "null"
          maximum: 1000000
          minimum: 0
        entrances:
          type:
            - integer
            - "null"
          maximum: 1000000
          minimum: 0
        exits:
          type:
            - integer
            - "null"
          maximum: 1000000
          minimum: 0
        maps:
          type:
            - integer
            - "null"
          maximum: 16
          minimum: 1
        entities:
          type:
            - integer
            - "null"
          maximum: 1000000
          minimum: 0
    FileStatsKindEnum:
      enum:
        - blueprint
        - scenario
      type: string
      description: |-
        * `blueprint` - blueprint
        * `scenario` - scenario
    IssuedKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        prefix:
          type: string
          maxLength: 16
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScopesEnum"
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
        key:
          type: string
          description: Shown only once. Store in the operating system credential store.
      required:
        - id
        - name
        - prefix
        - scopes
        - created_at
        - expires_at
        - last_used_at
        - revoked_at
        - key
    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 100
        summary:
          type: string
          maxLength: 180
        description:
          type: string
          description: Basic Markdown source. Supports emphasis, lists, quotes, code, small headings, and
            HTTP(S) links. HTML and embedded images are disabled.
          maxLength: 20000
        content_type:
          type: string
          description: "An enabled type from /api/v1/types/: blueprints or scenarios. Pack and mod uploads are
            disabled."
        author:
          type: string
          readOnly: true
        tags:
          type: string
          description: Comma-separated tags. Public responses include only tags meeting the configurable
            publication threshold (11 visible creations by default). Authors and staff browser
            sessions can read all assigned tags. Use /api/v1/tags/suggest/ for editing suggestions.
          maxLength: 200
        status:
          $ref: "#/components/schemas/ItemStatusEnum"
        publish_after_validation:
          type: boolean
          readOnly: true
        is_demo:
          type: boolean
          readOnly: true
        is_hidden:
          type: boolean
          readOnly: true
        hidden_reason:
          type: string
          readOnly: true
        deleted_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        featured_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        downloads:
          type: integer
          maximum: 2147483647
          minimum: 0
          readOnly: true
          description: Download links issued across all releases, deduplicated by account and by IP for 14
            days. IPv6 uses /32 subnets. Downloading another release does not recount the creation.
            Historical totals are retained.
        collection_count:
          type: integer
          minimum: 0
          readOnly: true
          description: Number of people who currently have this creation saved in their collection.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        releases:
          type: array
          items:
            $ref: "#/components/schemas/Release"
          readOnly: true
        screenshots:
          type: array
          items:
            $ref: "#/components/schemas/Screenshot"
          readOnly: true
      required:
        - id
        - title
        - summary
        - description
        - content_type
        - author
        - tags
        - status
        - publish_after_validation
        - is_demo
        - is_hidden
        - hidden_reason
        - deleted_at
        - featured_at
        - downloads
        - collection_count
        - created_at
        - updated_at
        - releases
        - screenshots
    ItemRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        summary:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          minLength: 1
          description: Basic Markdown source. Supports emphasis, lists, quotes, code, small headings, and
