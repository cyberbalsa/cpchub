                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/:
    get:
      operationId: v1_me_retrieve
      description: Minimal profile for the signed-in mod manager; no email or provider
        secrets.
      tags:
      - v1
      security:
      - PersonalAPIKey: []
      - oauth2:
        - read
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
