openapi: 3.1.0
info:
  title: CPC Hub API
  version: 1.0.0
  description: Versioned community catalog for Car Park Capital. OAuth authorization code + S256 PKCE
    for mod managers; scoped personal API keys for scripts.
paths:
  /api/v1/items/:
    get:
      operationId: v1_items_list
      parameters:
        - in: query
          name: max_depth
          schema:
            type: integer
            minimum: 0
          description: Maximum depth (tiles) in the latest release. Missing statistics never match. Bounds are
            inclusive.
        - in: query
          name: max_entities
          schema:
            type: integer
            minimum: 0
          description: Maximum saved entities in the latest release. Missing statistics never match. Bounds
            are inclusive.
        - in: query
          name: max_entrances
          schema:
            type: integer
            minimum: 0
          description: Maximum parking entrances in the latest release. Missing statistics never match. Bounds
            are inclusive.
        - in: query
          name: max_exits
          schema:
            type: integer
            minimum: 0
          description: Maximum parking exits in the latest release. Missing statistics never match. Bounds are
            inclusive.
        - in: query
          name: max_footprint_tiles
          schema:
            type: integer
            minimum: 0
          description: Maximum footprint area (tiles) in the latest release. Missing statistics never match.
            Bounds are inclusive.
        - in: query
          name: max_format_version
          schema:
            type: integer
            minimum: 0
          description: Maximum blueprint format version in the latest release. Missing statistics never match.
            Bounds are inclusive.
        - in: query
          name: max_golf_cart_spaces
          schema:
            type: integer
            minimum: 0
          description: Maximum golf cart spaces in the latest release. Missing statistics never match. Bounds
            are inclusive.
        - in: query
          name: max_height
          schema:
            type: integer
            minimum: 0
          description: Maximum height (tiles) in the latest release. Missing statistics never match. Bounds
            are inclusive.
        - in: query
          name: max_maps
          schema:
            type: integer
            minimum: 0
          description: Maximum maps in the latest release. Missing statistics never match. Bounds are inclusive.
        - in: query
          name: max_object_types
          schema:
            type: integer
            minimum: 0
          description: Maximum object types in the latest release. Missing statistics never match. Bounds are
            inclusive.
        - in: query
          name: max_objects
          schema:
            type: integer
            minimum: 0
          description: Maximum placed objects in the latest release. Missing statistics never match. Bounds
            are inclusive.
        - in: query
          name: max_parking_spaces
          schema:
            type: integer
            minimum: 0
          description: Maximum car parking spaces in the latest release. Missing statistics never match.
            Bounds are inclusive.
        - in: query
          name: max_width
          schema:
            type: integer
            minimum: 0
          description: Maximum width (tiles) in the latest release. Missing statistics never match. Bounds are
            inclusive.
        - in: query
          name: min_depth
          schema:
            type: integer
            minimum: 0
          description: Minimum depth (tiles) in the latest release. Missing statistics never match. Bounds are
            inclusive.
        - in: query
          name: min_entities
          schema:
            type: integer
            minimum: 0
          description: Minimum saved entities in the latest release. Missing statistics never match. Bounds
            are inclusive.
        - in: query
          name: min_entrances
          schema:
            type: integer
            minimum: 0
          description: Minimum parking entrances in the latest release. Missing statistics never match. Bounds
            are inclusive.
        - in: query
          name: min_exits
          schema:
            type: integer
            minimum: 0
          description: Minimum parking exits in the latest release. Missing statistics never match. Bounds are
            inclusive.
        - in: query
          name: min_footprint_tiles
          schema:
            type: integer
            minimum: 0
          description: Minimum footprint area (tiles) in the latest release. Missing statistics never match.
            Bounds are inclusive.
        - in: query
          name: min_format_version
          schema:
            type: integer
            minimum: 0
          description: Minimum blueprint format version in the latest release. Missing statistics never match.
            Bounds are inclusive.
        - in: query
          name: min_golf_cart_spaces
          schema:
            type: integer
            minimum: 0
          description: Minimum golf cart spaces in the latest release. Missing statistics never match. Bounds
            are inclusive.
        - in: query
          name: min_height
          schema:
            type: integer
            minimum: 0
          description: Minimum height (tiles) in the latest release. Missing statistics never match. Bounds
            are inclusive.
        - in: query
          name: min_maps
          schema:
            type: integer
            minimum: 0
          description: Minimum maps in the latest release. Missing statistics never match. Bounds are inclusive.
        - in: query
          name: min_object_types
          schema:
            type: integer
            minimum: 0
          description: Minimum object types in the latest release. Missing statistics never match. Bounds are
            inclusive.
        - in: query
          name: min_objects
          schema:
            type: integer
            minimum: 0
          description: Minimum placed objects in the latest release. Missing statistics never match. Bounds
            are inclusive.
        - in: query
          name: min_parking_spaces
          schema:
            type: integer
            minimum: 0
          description: Minimum car parking spaces in the latest release. Missing statistics never match.
            Bounds are inclusive.
        - in: query
          name: min_width
          schema:
            type: integer
            minimum: 0
          description: Minimum width (tiles) in the latest release. Missing statistics never match. Bounds are
            inclusive.
        - in: query
          name: mine
          schema:
            type: boolean
          description: Only your uploads
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - in: query
          name: q
          schema:
            type: string
          description: Search titles, descriptions and public tags (all own tags with mine=true)
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - newest
              - popular
              - updated
        - in: query
          name: tag
          schema:
            type: string
          description: Exact tag name, ignoring case and extra whitespace. Public tags only, unless mine=true.
        - in: query
          name: type
          schema:
            type: string
          description: Content type slug
        - in: query
          name: view
          schema:
            type: string
            enum:
              - all
              - mine
              - saved
        - in: query
          name: author
          schema:
            type: integer
            minimum: 1
      tags:
        - v1
      security:
        - PersonalAPIKey: []
        - oauth2:
            - read
        - cookieAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedItemList"
          description: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
    post:
      operationId: v1_items_create
      description: Create metadata for a blueprint or scenario. Pack and mod uploads are disabled. API
        items start as drafts; upload a raw .cpbp or .cpcs release and at least one screenshot, then
        PATCH status to published. Each item can have up to eight screenshots.
      tags:
        - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ItemRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ItemRequest"
        required: true
      security:
        - PersonalAPIKey: []
        - oauth2:
            - write
        - cookieAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "401":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
  /api/v1/items/{id}/:
    get:
      operationId: v1_items_retrieve
      description: Read a visible creation. Hidden creations return 403 with the public moderation reason.
        Shadow-banned and self-deleted creations return 404 to other users; their creator and staff
        browser sessions retain access. Drafts remain private to the creator and staff.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this item.
          required: true
      tags:
        - v1
      security:
        - PersonalAPIKey: []
        - oauth2:
            - read
        - cookieAuth: []
        - {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: ""
        "401":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
    patch:
      operationId: v1_items_partial_update
      description: Authors can edit their own metadata. Admin and Moderator browser sessions may edit any
        creation; API keys and OAuth tokens remain limited to their owner. Publishing requires an
        enabled file type, a validated release and at least one validated screenshot. Setting status
        to published while file checks are pending records the intent; the response remains draft
        until all checks pass. Records a revision; files and previous releases are immutable.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this item.
          required: true
      tags:
        - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchedItemRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PatchedItemRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PatchedItemRequest"
      security:
        - PersonalAPIKey: []
        - oauth2:
            - write
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "401":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
    delete:
      operationId: v1_items_destroy
      description: Author-only soft deletion. Immediately private to the creator and staff; recoverable
        for 14 days with POST restore/. After 14 days the creation and stored files are permanently
        removed.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this item.
          required: true
      tags:
        - v1
      security:
        - PersonalAPIKey: []
        - oauth2:
            - write
        - cookieAuth: []
      responses:
        "204":
          description: No response body
        "400":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
  /api/v1/items/{id}/history/:
    get:
      operationId: v1_items_history_list
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this item.
          required: true
      tags:
        - v1
      security:
        - PersonalAPIKey: []
        - oauth2:
            - read
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Revision"
          description: ""
        "401":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/items/{id}/releases/:
    post:
      operationId: v1_items_releases_create
      description: Upload to an owned creation, or use an Admin or Moderator browser session to add a
        release to any creation. The file type must be enabled. Published items must have at least
        one screenshot before adding a release. Version strings are unique per item. Existing
        releases cannot be overwritten. Returns 202 with a validation job. The creation stays draft
        until isolated checks finish. Poll upload-jobs/ for the result. Submitted creation files and
        new releases share a rolling limit of 16 uploads per hour per account across sessions, API
        keys and OAuth tokens. Admins, Moderators and Reviewers are exempt; screenshots do not use
        slots. A 429 response includes Retry-After in seconds.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this item.
          required: true
      tags:
        - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ReleaseUploadRequest"
        required: true
      security:
        - PersonalAPIKey: []
        - oauth2:
            - write
        - cookieAuth: []
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadJob"
          description: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "401":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "429":
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until an upload slot becomes available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
  /api/v1/items/{id}/releases/{release_id}/download/:
    get:
      operationId: v1_items_releases_download_retrieve
      description: Checks item visibility and streams the release from R2 through the Worker. Never
        edge-cached. Successful GETs count requests, not completed transfers. Counts deduplicate by
        account and IP; IP markers expire after 14 days and IPv6 uses /32 subnets. HEAD returns the
        same headers without bytes or download counting.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this item.
          required: true
        - in: path
          name: release_id
          schema:
            type: string
            format: uuid
          required: true
      tags:
        - v1
      security:
        - PersonalAPIKey: []
        - oauth2:
            - read
        - cookieAuth: []
        - {}
      responses:
        "200":
          headers:
            X-Content-SHA256:
              schema:
                type: string
              description: SHA-256 of the release file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ""
        "401":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
  /api/v1/items/{id}/restore/:
    post:
      operationId: v1_items_restore_create
      description: Restore your own self-deleted creation within 14 days. Existing draft status and
        moderation restrictions remain in effect.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this item.
          required: true
      tags:
        - v1
      security:
        - PersonalAPIKey: []
        - oauth2:
            - write
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "401":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
  /api/v1/items/{id}/screenshots/:
    post:
      operationId: v1_items_screenshots_create
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this item.
          required: true
      tags:
        - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ScreenshotUploadRequest"
        required: true
      security:
        - PersonalAPIKey: []
        - oauth2:
            - write
        - cookieAuth: []
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadJob"
          description: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "401":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
  /api/v1/items/{id}/screenshots/{screenshot_id}/:
    delete:
      operationId: v1_items_screenshots_destroy
      description: Remove an owned screenshot, or use an Admin browser session to remove any screenshot.
        Published creations must keep at least one screenshot; add a replacement or save as a draft
        first.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this item.
          required: true
        - in: path
          name: screenshot_id
          schema:
            type: string
            format: uuid
          required: true
      tags:
        - v1
      security:
        - PersonalAPIKey: []
        - oauth2:
            - write
        - cookieAuth: []
      responses:
        "204":
          description: No response body
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "401":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
  /api/v1/items/{id}/screenshots/{screenshot_id}/image/:
    get:
      operationId: v1_items_screenshots_image_retrieve
      description: Checks item visibility, then redirects new screenshots to the public unguessable
        screenshots CDN URL. Legacy screenshots return WebP bytes directly.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this item.
          required: true
        - in: path
          name: screenshot_id
          schema:
            type: string
            format: uuid
          required: true
      tags:
        - v1
      security:
        - PersonalAPIKey: []
        - oauth2:
            - read
        - cookieAuth: []
        - {}
      responses:
        "200":
          content:
            image/webp:
              schema:
                type: string
                format: binary
          description: ""
        "302":
          headers:
            Location:
              schema:
                type: string
              description: Public screenshots CDN URL.
          description: No response body
        "401":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
  /api/v1/items/{id}/upload-jobs/:
    get:
      operationId: v1_items_upload_jobs_list
      description: File-check status for the author or a staff browser session. Upload endpoints return
        202 with a job ID. Files remain private and the creation stays draft until checks finish. A
        passed job supplies its release or screenshot ID; a failed job supplies a safe error
        message.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this item.
          required: true
      tags:
        - v1
      security:
        - PersonalAPIKey: []
        - oauth2:
            - read
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadJob"
          description: ""
        "401":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/keys/:
    get:
      operationId: v1_keys_list
      parameters: []
      tags:
        - v1
      security:
        - oauth2:
            - keys:write
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedKeyList"
          description: ""
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: ""
    post:
      operationId: v1_keys_create
      description: Session or OAuth keys:write scope required. OAuth clients may mint only read/write
        scopes they hold, and manage only their own keys. API keys cannot mint more keys. The secret
        is returned once. Keys do not expire by default; omit days or send null. Set days to 1–90
        for an expiring key. All keys can be revoked.
      tags:
        - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyCreateRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/KeyCreateRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/KeyCreateRequest"
        required: true
      security:
