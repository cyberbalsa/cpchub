          - integer
          - 'null'
          maximum: 1000000
          minimum: 0
        parking_spaces:
          type:
          - integer
          - 'null'
          maximum: 1000000
          minimum: 0
          description: Saved ParkingBay objects; does not check road access or usability.
        golf_cart_spaces:
          type:
          - integer
          - 'null'
          maximum: 1000000
