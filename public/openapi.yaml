      required:
        - created_at
        - id
        - snapshot
    ScopesEnum:
      enum:
        - read
        - write
      type: string
      description: |-
        * `read` - read
        * `write` - write
    Screenshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        caption:
          type: string
          maxLength: 180
        image_url:
          type: string
          readOnly: true
          description: Public unguessable screenshots CDN URL, or application URL for legacy screenshots.
          format: uri
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - caption
        - image_url
        - created_at
    ScreenshotUploadRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
          description: Still PNG, JPEG or WebP; 320×180 minimum, 8192 pixels per side maximum, max 10 MB and
            20 megapixels; aspect ratio 1:6 to 6:1. Checked and re-encoded to WebP inside a private
            validation Worker. Returns a validation job.
        caption:
          type: string
          maxLength: 180
      required:
        - image
    Tag:
      type: object
      properties:
        name:
          type: string
          maxLength: 600
        item_count:
          type: integer
          minimum: 0
          readOnly: true
          description: Number of visible, published, non-demo creations using this tag.
      required:
        - item_count
        - name
    TagSuggestion:
      type: object
      properties:
        name:
          type: string
          maxLength: 600
      required:
        - name
    UploadJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
            - $ref: "#/components/schemas/UploadJobKindEnum"
          readOnly: true
        status:
          allOf:
            - $ref: "#/components/schemas/UploadJobStatusEnum"
          readOnly: true
        original_filename:
          type: string
          readOnly: true
        error:
          type: string
          readOnly: true
        release:
          type:
            - string
            - "null"
          format: uuid
          readOnly: true
        screenshot:
          type:
            - string
            - "null"
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        get_status_display:
          type: string
          enum:
            - Checking
            - Passed
            - Failed
          readOnly: true
      required:
        - id
        - kind
        - status
        - original_filename
        - error
        - release
        - screenshot
        - created_at
        - completed_at
        - get_status_display
    UploadJobKindEnum:
      enum:
        - release
        - screenshot
        - stats
      type: string
      description: |-
        * `release` - Game file
        * `screenshot` - Screenshot
        * `stats` - File statistics
    UploadJobStatusEnum:
      enum:
        - pending
        - passed
        - failed
      type: string
      description: |-
        * `pending` - Checking
        * `passed` - Passed
        * `failed` - Failed
    OAuthError:
      type: object
      properties:
        error: *a2
        error_description: *a2
      required:
        - error
        - error_description
    OAuthToken:
      type: object
      properties:
        access_token: *a2
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          minimum: 1
        refresh_token: *a2
        scope: *a2
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
        - scope
    OAuthTokenRequest:
      oneOf:
        - type: object
          properties:
            grant_type:
              const: authorization_code
              type: string
            client_id: *a2
            redirect_uri:
              type: string
              format: uri
            code: *a2
            code_verifier:
              type: string
              pattern: ^[A-Za-z0-9._~-]{43,128}$
          required:
            - grant_type
            - client_id
            - redirect_uri
            - code
            - code_verifier
        - type: object
          properties:
            grant_type:
              const: refresh_token
              type: string
            client_id: *a2
            refresh_token: *a2
          required:
            - grant_type
            - client_id
            - refresh_token
    OAuthRevokeRequest:
      type: object
      properties:
        client_id: *a2
        token: *a2
      required:
        - client_id
        - token
    OAuthAuthorizeRequest:
      type: object
      properties:
        client_id: *a2
        redirect_uri: *a3
        response_type: *a4
        code_challenge_method: *a5
        code_challenge: *a6
        scope: *a2
        state: *a2
        approve:
          type: string
          enum:
            - yes
            - no
        csrfmiddlewaretoken: *a2
      required:
        - client_id
        - redirect_uri
        - response_type
        - code_challenge_method
        - code_challenge
        - approve
        - csrfmiddlewaretoken
  securitySchemes:
    PersonalAPIKey:
      type: http
      scheme: bearer
      description: "Personal API key: Bearer cpc_<prefix>_<secret>. Legacy ApiKey and Api-Key prefixes
        remain accepted. Keys are scoped and revocable."
    cookieAuth:
      type: apiKey
      in: cookie
      name: cpc_session
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /o/authorize/
          tokenUrl: /o/token/
          scopes:
            read: Read your profile and catalog
            write: Publish and edit your uploads
            keys:write: Create and revoke API keys for this manager
servers:
  - url: https://cpchub.net
    description: Production
  - url: /
    description: Current host (including local development)
