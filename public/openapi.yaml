              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/types/{slug}/:
    get:
      operationId: v1_types_retrieve
      description: Discover enabled upload types and their accepted extensions.
