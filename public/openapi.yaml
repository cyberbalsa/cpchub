      - created_at
      - id
      - key
      - name
      - prefix
    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 100
        summary:
          type: string
          maxLength: 180
        description:
          type: string
          description: Basic Markdown source. Supports emphasis, lists, quotes, code,
            small headings, and HTTP(S) links. HTML and embedded images are disabled.
          maxLength: 20000
        content_type:
          type: string
          description: 'An enabled type from /api/v1/types/: blueprints or scenarios.
            Pack and mod uploads are disabled.'
        author:
          type: string
          readOnly: true
        tags:
          type: string
          description: Comma-separated tags. Public responses include only tags meeting
            the configurable publication threshold (11 visible creations by default).
            Authors and staff browser sessions can read all assigned tags. Use /api/v1/tags/suggest/
            for editing suggestions.
          maxLength: 200
        status:
          $ref: '#/components/schemas/ItemStatusEnum'
        publish_after_validation:
          type: boolean
          readOnly: true
        is_demo:
          type: boolean
          readOnly: true
        is_hidden:
          type: boolean
          readOnly: true
        hidden_reason:
          type: string
          readOnly: true
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        featured_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        downloads:
          type: integer
          maximum: 2147483647
          minimum: 0
          readOnly: true
          description: Download links issued across all releases, deduplicated by
            account and by IP for 14 days. IPv6 uses /32 subnets. Downloading another
            release does not recount the creation. Historical totals are retained.
        collection_count:
          type: integer
          minimum: 0
          readOnly: true
