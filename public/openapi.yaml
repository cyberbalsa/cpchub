components:
  schemas:
    ContentType:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 200
        allowed_extensions:
          description: Lowercase extensions, e.g. [".zip", ".cpbp", ".json"]. ZIP
            contents are not executed or extracted.
        uploads_enabled:
          type: boolean
          description: Allow new creations and releases for this type.
        max_upload_bytes:
          type: integer
          readOnly: true
          description: Current maximum size of each game file. Defaults to 15 MiB;
            Admin-adjustable.
      required:
      - max_upload_bytes
      - name
      - slug
    Error:
      type: object
      properties:
        status:
          type: integer
        errors:
          description: Field errors or a detail message.
      required:
      - errors
      - status
    FileStats:
      type: object
      properties:
        schema_version:
          type: integer
          maximum: 1
          minimum: 1
        kind:
          $ref: '#/components/schemas/FileStatsKindEnum'
        format_version:
          type:
          - integer
          - 'null'
          maximum: 3
          minimum: 2
        width:
          type: integer
          maximum: 2048
          minimum: 1
          description: Blueprint width, or largest map width, in tiles.
        depth:
          type: integer
          maximum: 2048
          minimum: 1
          description: Blueprint depth, or largest map depth, in tiles.
        height:
          type: integer
          maximum: 2048
          minimum: 1
          description: Blueprint height, or largest map height, in tiles.
        footprint_tiles:
          type: integer
          maximum: 67108864
          minimum: 1
          description: Width × depth for blueprints; sum of map areas for scenarios.
        objects:
          type:
          - integer
          - 'null'
          maximum: 1000000
          minimum: 0
        object_types:
          type:
          - integer
          - 'null'
          maximum: 1000000
          minimum: 0
        parking_spaces:
          type:
          - integer
          - 'null'
          maximum: 1000000
          minimum: 0
          description: Saved ParkingBay objects; does not check road access or usability.
        golf_cart_spaces:
          type:
          - integer
          - 'null'
          maximum: 1000000
          minimum: 0
        entrances:
          type:
          - integer
          - 'null'
          maximum: 1000000
          minimum: 0
        exits:
          type:
          - integer
          - 'null'
          maximum: 1000000
          minimum: 0
        maps:
          type:
          - integer
          - 'null'
          maximum: 16
          minimum: 1
        entities:
          type:
          - integer
          - 'null'
          maximum: 1000000
          minimum: 0
    FileStatsKindEnum:
      enum:
      - blueprint
      - scenario
      type: string
      description: |-
        * `blueprint` - blueprint
        * `scenario` - scenario
    FileStatsRequest:
      type: object
      properties:
        schema_version:
          type: integer
          maximum: 1
          minimum: 1
        kind:
          $ref: '#/components/schemas/FileStatsKindEnum'
        format_version:
          type:
          - integer
          - 'null'
          maximum: 3
          minimum: 2
        width:
          type: integer
          maximum: 2048
          minimum: 1
          description: Blueprint width, or largest map width, in tiles.
        depth:
          type: integer
          maximum: 2048
          minimum: 1
          description: Blueprint depth, or largest map depth, in tiles.
        height:
          type: integer
          maximum: 2048
          minimum: 1
