worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # This listener is bound to host loopback and reached through cloudflared.
    map $http_cf_connecting_ip $client_ip {
        "" $remote_addr;
        default $http_cf_connecting_ip;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        default http;
        https https;
    }
    map "$request_method:$uri" $auth_limit_key {
        default "";
        ~^POST:/(accounts/|o/|admin/login/) $client_ip;
    }
    map "$request_method:$uri" $write_limit_key {
        default "";
        ~^(POST|PATCH|PUT|DELETE):/(api/|upload/|items/) $client_ip;
    }
    limit_req_zone $auth_limit_key zone=auth:10m rate=10r/m;
    limit_req_zone $write_limit_key zone=writes:10m rate=30r/m;
    limit_req_status 429;

    # Query strings can contain OAuth codes; keep them out of access logs.
    log_format cpc '$client_ip [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout cpc;

    resolver @CONTAINER_DNS@ valid=10s ipv6=off;
    upstream django {
        zone django 64k;
        server web:8000 resolve;
    }

    server {
        listen 8080 default_server;
        server_name _;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location / { return 444; }
    }
    server {
        listen 8080;
        server_name www.cpchub.net;
        return 301 https://cpchub.net$request_uri;
    }
    server {
        listen 8080;
        server_name cpchub.net;
        client_max_body_size 95m;
        client_body_timeout 60s;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location / {
            limit_req zone=auth burst=10 nodelay;
            limit_req zone=writes burst=10 nodelay;
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_request_buffering off;
        }
    }
}
